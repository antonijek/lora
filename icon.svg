<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c8a52"/>
      <stop offset="100%" stop-color="#0e4d2e"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2ecdb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- zadnja karta: pik -->
  <g transform="translate(300 254) rotate(14) translate(-110 -150)">
    <rect width="220" height="300" rx="24" fill="url(#card)" stroke="#1a1a1a" stroke-width="6"/>
    <text x="160" y="110" font-size="90" text-anchor="middle" fill="#1a1a1a" font-family="Segoe UI Symbol, DejaVu Sans, sans-serif">♠</text>
  </g>
  <!-- prednja karta: dama herc -->
  <g transform="translate(206 262) rotate(-10) translate(-110 -150)">
    <rect width="220" height="300" rx="24" fill="url(#card)" stroke="#1a1a1a" stroke-width="6"/>
    <text x="24" y="70" font-family="Georgia, serif" font-weight="700" font-size="58" fill="#c62828">Q</text>
    <text x="110" y="214" font-size="160" text-anchor="middle" fill="#c62828" font-family="Segoe UI Symbol, DejaVu Sans, sans-serif">♥</text>
  </g>
</svg>
