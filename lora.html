<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lora online — kartaška igra</title>
  <meta name="description" content="Lora (lore, lorum) online protiv računara — besplatno, bez registracije. Svih 7 igara: maksimum, minimum, herc, dame, žandar, kralj herc i lora.">
  <meta name="theme-color" content="#0f4d2e">
  <link rel="stylesheet" href="./lora.css">
</head>
<body>
  <header class="topbar">
    <h1>Lora</h1>
    <div class="contract"><b id="contractName"></b><span id="dealNo"></span></div>
    <div class="top-buttons">
      <button id="sheetBtn" class="icon-btn" aria-label="Tabela">▦</button>
      <button id="menuBtn" class="icon-btn" aria-label="Meni">☰</button>
    </div>
  </header>

  <p id="goal" class="goal"></p>

  <main class="board">
    <section class="seat seat-top" data-seat="2"></section>
    <section class="seat seat-left" data-seat="3"></section>
    <section class="center">
      <div id="trick" class="trick"></div>
      <div id="layout" class="layout" hidden></div>
      <div id="choose" class="choose" hidden></div>
      <div id="toast" class="toast" role="status"></div>
    </section>
    <section class="seat seat-right" data-seat="1"></section>
    <section class="seat seat-me" data-seat="0"></section>
  </main>

  <div id="myHand" class="hand" aria-label="Vaše karte"></div>

  <dialog id="menu">
    <h2>Meni</h2>
    <label>Protivnici
      <select id="levelSel">
        <option value="easy">Početnici</option>
        <option value="medium" selected>Iskusni</option>
      </select>
    </label>
    <div class="dialog-buttons">
      <button id="newGameBtn" class="btn primary">Nova igra</button>
      <a class="btn ghost" href="./pravila.html">Pravila</a>
      <button id="closeMenuBtn" class="btn ghost">Zatvori</button>
    </div>
  </dialog>

  <dialog id="dealEnd">
    <h2 id="dealEndTitle"></h2>
    <table class="result">
      <thead><tr><th></th><th>Ova igra</th><th>Ukupno</th></tr></thead>
      <tbody id="dealEndBody"></tbody>
    </table>
    <div class="dialog-buttons">
      <button id="nextDealBtn" class="btn primary">Dalje</button>
      <button id="dealSheetBtn" class="btn ghost">Tabela</button>
    </div>
  </dialog>

  <dialog id="sheet" class="sheet-dialog">
    <h2>Tabela</h2>
    <div class="sheet-scroll sheet" id="sheetBody"></div>
    <div class="dialog-buttons"><button id="closeSheetBtn" class="btn primary">Zatvori</button></div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
