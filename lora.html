<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lora online — kartaška igra</title>
  <meta name="description" content="Lora (lore, lorum) online protiv računara — besplatno, bez registracije. Svih 7 igara: maksimum, minimum, herc, dame, žandar, kralj herc i lora.">
  <meta name="theme-color" content="#0d1f17">
  <link rel="stylesheet" href="./lora.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Lora</h1>
      <div class="progress" title="Odigrane partije"><span id="dealNo"></span><i><b id="dealBar"></b></i></div>
    </div>
    <div class="contract"><b id="contractName"></b></div>
    <div class="top-buttons">
      <button id="chatBtn" class="icon-btn" aria-label="Chat" title="Chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span id="chatBadge" class="badge" hidden></span></button>
      <a id="adminBtn" class="icon-btn admin-only" href="./admin.html" aria-label="Admin panel" title="Admin panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></a>
      <button id="sheetBtn" class="icon-btn" aria-label="Tabela" title="Tabela"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></svg></button>
      <button id="menuBtn" class="icon-btn" aria-label="Meni" title="Meni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>

  <main class="room">
    <div class="table" aria-hidden="true"></div>

    <section class="seat seat-top" data-seat="2"></section>
    <section class="seat seat-left" data-seat="3"></section>
    <section class="seat seat-right" data-seat="1"></section>

    <section class="center">
      <div id="trick" class="trick"></div>
      <div id="layout" class="layout" hidden></div>
      <p id="centerMsg" class="center-msg" hidden></p>
      <div id="toast" class="toast" role="status"></div>
    </section>

    <section class="seat seat-me" data-seat="0"></section>
  </main>

  <footer class="hand-row">
    <div class="hand-side"></div>
    <div id="myHand" class="hand" aria-label="Vaše karte"></div>
    <div id="actions" class="hand-side actions"></div>
  </footer>

  <dialog id="menu" class="menu-pop" aria-label="Meni">
    <nav class="menu-list">
      <button id="newGameBtn" class="menu-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Nova igra</button>
      <button id="leaveMatchBtn" class="menu-item danger" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg>Napusti meč</button>
      <button id="homeBtn" class="menu-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg>Početna</button>
      <a class="menu-item" href="./pravila.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5zM9 12h6M9 16h6"/></svg>Pravila</a>
    </nav>
  </dialog>

  <dialog id="dealEnd">
    <h2 id="dealEndTitle"></h2>
    <table class="result">
      <thead><tr><th></th><th>Ova igra</th><th>Ukupno</th></tr></thead>
      <tbody id="dealEndBody"></tbody>
    </table>
    <div class="dialog-buttons">
      <button id="nextDealBtn" class="btn primary">Dalje</button>
      <button id="dealSheetBtn" class="btn">Tabela</button>
    </div>
  </dialog>

  <dialog id="sheet" class="sheet-dialog">
    <h2>Tabela</h2>
    <div class="sheet-scroll sheet" id="sheetBody"></div>
    <div class="dialog-buttons"><button id="closeSheetBtn" class="btn primary">Zatvori</button></div>
  </dialog>

  <!-- ===================== ekrani van stola ===================== -->
  <section id="startScreen" class="screen" hidden>
    <div class="panel hero">
      <h2>Lora</h2>
      <p class="muted">Kartaška igra za četvoro — sedam igara, 28 partija.</p>
      <button id="goOnlineBtn" class="btn primary big">Igraj online</button>
      <button id="goLocalBtn" class="btn big">Igraj protiv računara</button>
      <a class="link" href="./pravila.html">Pravila igre</a>
      <a class="admin-link admin-only" href="./admin.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Admin panel</a>
    </div>
  </section>

  <section id="loginScreen" class="screen" hidden>
    <form id="loginForm" class="panel" autocomplete="on">
      <h2 id="loginTitle">Prijava</h2>
      <label id="nameRow" hidden>Ime za stolom<input id="loginName" maxlength="40" autocomplete="nickname"></label>
      <label>Email<input id="loginEmail" type="email" required autocomplete="email"></label>
      <label>Lozinka<input id="loginPassword" type="password" required minlength="4" autocomplete="current-password"></label>
      <p id="loginError" class="error" role="alert"></p>
      <button id="loginSubmit" class="btn primary big" type="submit">Prijavi se</button>
      <button id="loginToggle" class="link" type="button">Nemate nalog? Registrujte se</button>
      <button class="link backHome" type="button">← Nazad</button>
    </form>
  </section>

  <section id="lobbyScreen" class="screen" hidden>
    <div class="panel lobby">
      <div class="lobby-top">
        <button class="link backHome" type="button">← Početna</button>
        <div class="me-box"><span id="lobbyMe"></span><a class="admin-link admin-only" href="./admin.html" title="Admin panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Admin</a><button id="logoutBtn" class="link" type="button">Odjava</button></div>
      </div>
      <h2>Online Lora</h2>
      <div class="lobby-actions">
        <button id="quickBtn" class="action primary" type="button"><b>Brza igra</b><span>Uđi u prvu slobodnu sobu. Prazna mesta popunjava računar.</span></button>
        <button id="createBtn" class="action" type="button"><b>Napravi sobu</b><span>Pozovi prijatelje kodom ili linkom.</span></button>
      </div>
      <form id="joinForm" class="join">
        <label for="joinCode">Imaš kod sobe?</label>
        <div class="join-row"><input id="joinCode" placeholder="npr. 7K2QX" maxlength="5" autocapitalize="characters" autocomplete="off"><button class="btn" type="submit">Uđi</button></div>
      </form>
      <p id="lobbyError" class="error" role="alert"></p>
      <div class="lobby-cols">
        <section class="box"><h3>Otvorene sobe</h3><ul id="roomList" class="list"></ul></section>
        <section class="box"><h3>Online sada <span id="onlineCount" class="count"></span></h3><ul id="onlineList" class="list"></ul></section>
        <section class="box"><h3>Najbolji igrači</h3><ol id="leaderboard" class="list"></ol></section>
      </div>
    </div>
  </section>

  <section id="waitingScreen" class="screen" hidden>
    <div class="panel wide">
      <h2>Soba <span id="roomCode" class="code"></span></h2>
      <p class="muted small">Pošaljite kod ili link prijateljima. <button id="copyLinkBtn" class="link" type="button">Kopiraj link</button></p>
      <div id="waitSeats" class="wait-seats"></div>
      <p id="waitHint" class="muted small"></p>
      <div class="dialog-buttons">
        <button id="startBtn" class="btn primary big">Počni</button>
        <button id="inviteBtn" class="btn">Pozovi igrače</button>
        <button id="leaveRoomBtn" class="btn">Izađi</button>
      </div>
      <ul id="inviteList" class="list" hidden></ul>
    </div>
  </section>

  <aside id="chatPanel" class="chat" hidden>
    <div class="chat-head"><b>Chat</b><button id="chatClose" class="icon-btn" aria-label="Zatvori chat">✕</button></div>
    <div id="chatLog" class="chat-log"></div>
    <form id="chatForm" class="chat-form"><input id="chatInput" maxlength="300" placeholder="Poruka…" autocomplete="off"><button class="btn primary" type="submit">Pošalji</button></form>
  </aside>

  <dialog id="inviteDialog">
    <h2>Poziv</h2>
    <p id="inviteText"></p>
    <div class="dialog-buttons"><button id="inviteAccept" class="btn primary">Uđi u sobu</button><button id="inviteDecline" class="btn">Ne sada</button></div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
